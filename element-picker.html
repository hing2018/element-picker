<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>矽基因子 · 元素抽取器</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: #121a26;
    --border: #1e2b3d;
    --text: #d7e3f4;
    --muted: #6b7f99;
    --accent: #4fd1ff;
    --accent-2: #a78bfa;
    --danger: #ff6b6b;
    --ok: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: radial-gradient(1200px 600px at 70% -10%, #14203a 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 640px; }
  header { text-align: center; margin-bottom: 28px; }
  header h1 {
    font-size: 22px;
    letter-spacing: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  header p { color: var(--muted); font-size: 13px; margin-top: 6px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 20px;
  }

  /* 抽取區 */
  .draw-area { text-align: center; }
  #notice {
    display: none;
    background: rgba(255, 107, 107, 0.12);
    border: 1px solid rgba(255, 107, 107, 0.4);
    color: var(--danger);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  #drawBtn {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0a0e14;
    border: none;
    border-radius: 999px;
    padding: 22px 64px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 8px;
    cursor: pointer;
    width: 100%;
    margin-top: 24px;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    box-shadow: 0 0 26px rgba(79, 209, 255, 0.3);
  }
  #drawBtn:hover { transform: translateY(-2px); box-shadow: 0 0 34px rgba(79, 209, 255, 0.4); }
  #drawBtn:active { transform: translateY(0); }

  /* 結果 */
  .result {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .result-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(10, 14, 20, 0.5);
  }
  .row-top {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .tag-desc {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
    letter-spacing: 1px;
    padding-left: 68px;
  }
  .tag-desc .avoid {
    color: #8f9db3;
    font-style: italic;
  }
  .role {
    flex: 0 0 56px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
  }
  .role.primary { color: var(--accent); }
  .tag {
    flex: 1;
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 2px;
  }
  .tag.primary {
    color: var(--accent);
    text-shadow: 0 0 14px rgba(79, 209, 255, 0.55);
  }
  .tag.secondary { color: var(--accent-2); }
  .result-empty {
    color: var(--muted);
    text-align: center;
    padding: 20px 0;
    font-size: 14px;
    letter-spacing: 2px;
  }

  /* 清單編輯區 */
  .list-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }
  .list-head h2 { font-size: 15px; letter-spacing: 2px; color: var(--accent); }
  .list-head .chevron { color: var(--muted); transition: transform 0.2s ease; }
  .list-head.open .chevron { transform: rotate(180deg); }
  .list-body { display: none; margin-top: 16px; }
  .list-body.open { display: block; }
  .list-hint { color: var(--muted); font-size: 12px; margin-bottom: 10px; line-height: 1.6; }
  textarea {
    width: 100%;
    min-height: 180px;
    background: #0a0e14;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    line-height: 1.9;
    resize: vertical;
    font-family: inherit;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .list-actions {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .btn {
    flex: 1;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0a0e14;
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.12s ease, color 0.12s ease;
    font-family: inherit;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  #saveMsg {
    display: none;
    margin-top: 10px;
    font-size: 13px;
    color: var(--ok);
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 2px;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>元素抽取器</h1>
    <p>隨機抽出三種外觀元素，標定主標籤與副標籤</p>
  </header>

  <div class="panel draw-area">
    <div id="notice"></div>
    <div class="result" id="result">
      <div class="result-empty">按下抽取，隨機獲得三個元素</div>
    </div>
    <button id="drawBtn">抽　取</button>
  </div>

  <div class="panel list-panel">
    <div class="list-head" id="listHead">
      <h2>元素清單</h2>
      <span class="chevron" id="chevron">▼</span>
    </div>
    <div class="list-body" id="listBody">
      <p class="list-hint">每行一個元素。修改後按「儲存清單」即生效，下次抽取使用你的清單。</p>
      <textarea id="listTextarea" spellcheck="false"></textarea>
      <div class="list-actions">
        <button class="btn" id="saveBtn">儲存清單</button>
        <button class="btn danger" id="resetBtn">還原預設</button>
      </div>
      <div id="saveMsg">已儲存</div>
    </div>
  </div>

  <footer>矽基獵獸 · 型態標籤隨機工具</footer>
</div>

<script>
(function () {
  var STORAGE_KEY = 'element-picker-list';

  var DEFAULT_TAGS = [
    '克蘇魯', '宗教', '迷信', '科技', '矽基', '大自然', '機械',
    '神聖', '抽象', '飛天麵條教', '動物', '人體', '宇宙'
  ];

  var TAG_DESCRIPTIONS = {
    '克蘇魯': { desc: '觸手、非歐幾里得形體、不可名狀的存在感；裝甲扭曲生長、不符合結構常理。', avoid: '章魚、克蘇魯（直接用神名）' },
    '宗教': { desc: '祭儀、聖物、教條符號化裝甲；幾何圖騰與儀式性配置，肅穆而不失機能。', avoid: '佛教、神道教（特定教別）' },
    '迷信': { desc: '護符、禁忌、避凶圖騰；繩結、符籙、咒文刻印，規避不祥的設計語言。', avoid: '詛咒（負面語感）' },
    '科技': { desc: '高密度機構、量子紋理、精密結構；奈米級細節與儀表感，理性而冷冽。', avoid: '未來風、賽博龐克' },
    '矽基': { desc: '矽晶結晶、液態金屬、自組織幾何；以矽機生命本質為底，結晶面與流體曲面共存。', avoid: '玻璃、塑膠' },
    '大自然': { desc: '有機曲線、植石共生、生態偽裝；與星球生態相融，生長與環境一體。', avoid: '植物、樹木' },
    '機械': { desc: '齒輪、關節、外露機能；真實金屬機構感，關節運作可見，無多餘裝飾。', avoid: '機器人、鋼彈' },
    '神聖': { desc: '光暈、圓環、肅穆對稱；幾何完美與光輝，超越塵世的存在感。', avoid: '天使、上帝' },
    '抽象': { desc: '純幾何、無重力懸浮、色塊構成；不指向具體物象，以構成感取勝。', avoid: '概念藝術' },
    '飛天麵條教': { desc: '麵條觸鬚、肉丸、荒誕喜感；設計上限的「安全閥」，讓世界觀偶爾保有幽默。', avoid: '宗教褻瀆、諷刺' },
    '動物': { desc: '地球生物原型、擬態；以地球動物為模板塑形，行動姿態與習性可辨識。', avoid: '怪獸、寵物' },
    '人體': { desc: '人形輪廓、義體結構；類人比例與機械義肢結合，接近人的存在感。', avoid: '人類、人造人' },
    '宇宙': { desc: '天體紋理、星雲光紋、深空感；星塵質感與星系花紋，承載星空的意象。', avoid: '太空站、火箭' }
  };

  var el = {
    notice: document.getElementById('notice'),
    drawBtn: document.getElementById('drawBtn'),
    result: document.getElementById('result'),
    listHead: document.getElementById('listHead'),
    listBody: document.getElementById('listBody'),
    chevron: document.getElementById('chevron'),
    textarea: document.getElementById('listTextarea'),
    saveBtn: document.getElementById('saveBtn'),
    resetBtn: document.getElementById('resetBtn'),
    saveMsg: document.getElementById('saveMsg')
  };

  function loadTags() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw === null) return DEFAULT_TAGS.slice();
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return DEFAULT_TAGS.slice();
      return arr.filter(function (t) { return typeof t === 'string' && t.trim() !== ''; })
                .map(function (t) { return t.trim(); });
    } catch (e) {
      return DEFAULT_TAGS.slice();
    }
  }

  function saveTags(tags) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tags));
  }

  function showNotice(msg) {
    el.notice.textContent = msg;
    el.notice.style.display = 'block';
  }

  function hideNotice() {
    el.notice.style.display = 'none';
  }

  function draw(tags) {
    if (tags.length < 3) {
      showNotice('元素不足三個，請先新增元素再抽取（目前 ' + tags.length + ' 個）。');
      el.result.innerHTML = '<div class="result-empty">元素不足三個</div>';
      return;
    }
    hideNotice();
    var pool = tags.slice();
    var picks = [];
    while (picks.length < 3) {
      var i = Math.floor(Math.random() * pool.length);
      picks.push(pool.splice(i, 1)[0]);
    }
    el.result.innerHTML =
      '<div class="result-row">' + rowHtml('主標籤', picks[0], true) + '</div>' +
      '<div class="result-row">' + rowHtml('副標籤', picks[1], false) + '</div>' +
      '<div class="result-row">' + rowHtml('副標籤', picks[2], false) + '</div>';
  }

  function rowHtml(role, tag, isPrimary) {
    var cls = isPrimary ? 'primary' : 'secondary';
    var desc = descHtml(tag);
    return '<div class="row-top"><span class="role ' + cls + '">' + role + '</span>' +
      '<span class="tag ' + cls + '">' + escapeHtml(tag) + '</span></div>' + desc;
  }

  function descHtml(tag) {
    var d = TAG_DESCRIPTIONS[tag];
    if (!d) return '';
    var html = escapeHtml(d.desc);
    if (d.avoid) {
      html += '<br><span class="avoid">_Avoid_: ' + escapeHtml(d.avoid) + '</span>';
    }
    return '<div class="tag-desc">' + html + '</div>';
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  var currentTags = loadTags();

  el.drawBtn.addEventListener('click', function () {
    currentTags = loadTags();
    draw(currentTags);
  });

  el.listHead.addEventListener('click', function () {
    var open = el.listBody.classList.toggle('open');
    el.listHead.classList.toggle('open', open);
  });

  function refreshTextarea() {
    el.textarea.value = currentTags.join('\n');
    el.saveMsg.style.display = 'none';
  }

  el.saveBtn.addEventListener('click', function () {
    var tags = el.textarea.value.split('\n')
      .map(function (t) { return t.trim(); })
      .filter(function (t) { return t !== ''; });
    if (tags.length === 0) {
      showNotice('清單不能是空的，請至少留一個元素。');
      return;
    }
    currentTags = tags;
    saveTags(tags);
    el.saveMsg.style.display = 'block';
    hideNotice();
    setTimeout(function () { el.saveMsg.style.display = 'none'; }, 1500);
  });

  el.resetBtn.addEventListener('click', function () {
    currentTags = DEFAULT_TAGS.slice();
    saveTags(currentTags);
    refreshTextarea();
    hideNotice();
    el.saveMsg.style.display = 'none';
  });

  refreshTextarea();
  draw(currentTags);
})();
</script>
</body>
</html>
